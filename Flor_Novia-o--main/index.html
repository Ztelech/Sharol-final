<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flor Para Ti - Recuerdos</title>
  <link rel="stylesheet" href="https://public.codepenassets.com/css/reset-2.0.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .back-btn-universe {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(18, 10, 36, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 182, 193, 0.35);
      border-radius: 30px;
      color: #fff;
      text-decoration: none;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 15px rgba(255, 105, 180, 0.2);
      transition: all 0.3s ease;
    }
    .back-btn-universe:hover {
      background: rgba(255, 105, 180, 0.3);
      border-color: rgba(255, 182, 193, 0.8);
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 105, 180, 0.4);
      color: #fff;
    }
  </style>
</head>
<body>
<a href="../index.html" class="back-btn-universe">← Volver a Mi mini universo</a>
<div id="main-content">
  <div class="container" id="start-btn-container">
    <button id="start-btn" class="button"></button>
  </div>
  <audio id="bg-music" src="musica/Juanes - Es Por Ti (Official Music Video).mp3" preload="none"></audio>
  <canvas id="galaxy-canvas" style="display:none;opacity:0;will-change:opacity;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:10;"></canvas>
  <div class="wrapper" style="display:none;">
      <div class="flower"></div>
  </div>
  <div class="flower-message" style="display:none;"></div>
</div>
<style>
/* Eliminado keyframes spin: no se usa loader */
</style>
<!-- partial -->
<script src="js/main.js" defer></script>

</body>
</html>
